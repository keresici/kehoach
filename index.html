<html lang="vi">

<title>Kế Hoạch</title>
<style>
:root{--paper:#f9f5ed;--card:#fff;--ink:#29292e;--muted:#8f8a80;--line:#e6ded1;--accent:#547361;--done:#549e70;--warn:#d66654;--amber:#e0a138}

.navh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:44px}

.navh .t{text-align:center;flex:1}.navh .t b{display:block;font-size:21px}.navh .t small{color:var(--muted);font-size:12px}

.row{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:12px}
.strike{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid #b9b3a8;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.check.on{background:var(--done);border-color:var(--done)}
.check.on::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.plus{border:0;background:var(--accent);color:#fff;width:30px;height:30px;border-radius:50%;font-size:20px;line-height:1;padding:0}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--done);border-radius:8px;transition:width .3s}
.goal{align-items:flex-start;padding:9px 0;border-bottom:1px solid #f1ece3}.goal:last-child{border-bottom:0}
.tiles{display:flex;gap:10px}.tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;text-align:center}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mtile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:14px;min-width:0}
.mtile.cur{border:2px solid var(--accent)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal .d{min-height:54px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 0;background:#fbf9f4;border:0;font-size:14px;color:var(--ink)}
.cal .d .n{width:28px;height:28px;line-height:28px;border-radius:50%}
.cal .d.today .n{background:var(--accent);color:#fff;font-weight:700}
.dots{display:flex;gap:2px;height:6px}.dots i{width:5px;height:5px;border-radius:50%;display:block}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.week{display:flex;gap:6px;margin-bottom:14px}

.week button b{font-size:17px}.week button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.week button.td{border-color:var(--accent)}
.wdot{width:5px;height:5px;border-radius:50%;display:block}
.hour{display:flex;gap:10px;padding:3px 0}

.chip::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--c)}
.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;flex:none}
.banner{display:flex;gap:8px;align-items:center;background:rgba(214,102,84,.12);color:var(--warn);border-radius:12px;padding:12px;margin-bottom:14px;font-weight:600;border:0;width:100%;text-align:left;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:9}

.entry{display:flex;align-items:center;gap:12px;padding:7px 0}
.ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0}.hbar .lb{width:96px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:20px}.hbar .tr i{display:block;height:100%;border-radius:5px;min-width:2px}.hbar .v{font-size:12px;color:var(--muted);min-width:46px;text-align:right}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:#eee8de;stroke-width:1}.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet-wrap.show{display:flex}
#sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.sheet-h button{border:0;background:none;font-size:16px;color:var(--accent);min-width:56px}.sheet-h b{font-size:16px}
.field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:0;font-size:16px;background:none;color:var(--ink);font-family:inherit;outline:none;padding:2px 0;-webkit-appearance:none;appearance:none;min-height:24px}
.field textarea{resize:none}
.money-input{font-size:30px!important;font-weight:800}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;padding:4px 0}
.cats button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:0}
.cats .ic{width:46px;height:46px;font-size:21px}
.cats button.on{color:var(--ink);font-weight:700}.cats button.on .ic{box-shadow:0 0 0 2.5px var(--accent)}
.quick{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.quick button{border:0;border-radius:20px;padding:7px 12px;background:rgba(84,115,97,.12);color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600;margin-bottom:10px;background:#fff;color:var(--accent);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:rgba(214,102,84,.1);color:var(--warn);border-color:transparent}
.mini{border:0;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700}
.tbl{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.tr3{display:grid;grid-template-columns:38% 24% 38%;border-top:1px solid var(--line)}
.tr3>div{padding:9px 7px;min-width:0;word-break:break-word}
.tr3>div+div{border-left:1px solid var(--line)}
.th3{border-top:0;background:#f4efe6;font-size:12px;font-weight:800;color:var(--ink)}
.th3>div{padding:9px 7px}
.tr3 .tt{font-weight:600;font-size:14px;line-height:1.3}
.tr3 .tm{font-size:11px;color:var(--muted);margin-top:3px}
.stbtn{width:100%;border:0;border-radius:9px;padding:8px 2px;font-size:12px;font-weight:800;line-height:1.25}
.mv{width:100%;border:0;background:none;color:var(--warn);font-size:11px;font-weight:700;margin-top:6px;padding:2px 0}
.reason{width:100%;border:1px solid var(--line);border-radius:9px;padding:6px 7px;font-size:13px;font-family:inherit;color:var(--ink);background:#fcfaf6;resize:none;min-height:58px;outline:none;display:block}
.reason.need{border-color:var(--warn);background:#fdf1ee}
.reason:focus{border-color:var(--accent);background:#fff}
.tadd{width:100%;border:0;border-top:1px dashed var(--line);background:none;padding:12px;color:var(--accent);font-weight:700;font-size:14px}
.moods{display:flex;justify-content:space-between;gap:4px}
.moods button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted)}
.moods button span{font-size:26px;line-height:1.1}
.moods button.on{border:2px solid var(--accent);background:#eef3ef;color:var(--ink);font-weight:700}
.jt{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;line-height:1.5;color:var(--ink);background:#fcfaf6;resize:vertical;outline:none;display:block}
.jt:focus{border-color:var(--accent);background:#fff}
.saved{font-size:11px;color:var(--muted);text-align:right;margin-top:6px;min-height:14px}
.lesson{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f1ece3}.lesson:last-child{border-bottom:0}
.lesson .lt{flex:1;min-width:0;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eef3ef;color:var(--accent);margin-top:4px}
.star{border:0;background:none;font-size:20px;padding:0 2px;line-height:1;color:#d4cbbd}.star.on{color:#e0a138}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--ink)}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;background:#fff;margin-bottom:10px;outline:none;font-family:inherit}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow select{border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;padding:0 6px;max-width:120px}
.review{background:linear-gradient(135deg,#547361,#6f8f7c);color:#fff;border:0}.review .q{font-family:"New York",Georgia,serif;font-size:18px;line-height:1.45;margin:8px 0 10px;white-space:pre-wrap}
.stat3{display:flex;gap:10px}.stat3>div{flex:1;text-align:center}.stat3 b{display:block;font-size:22px}
.mcal .d{min-height:44px}.mcal .d .e{font-size:17px;line-height:1}
.info{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1ece3;font-size:13px}.info:last-child{border-bottom:0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-180%);background:var(--done);color:#fff;padding:12px 18px;border-radius:24px;font-weight:600;font-size:14px;z-index:30;transition:transform .35s;width:max-content;max-width:90%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#toast.show{transform:translate(-50%,0)}#toast.warn{background:var(--warn)}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="sheet-wrap"><div id="sheet"></div></div>
<input type="file" id="f-import" accept=".json,application/json" style="display:none">

<script>
"use strict";
// ================== Dữ liệu & tiện ích ==================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const C = {done:"#549e70", warn:"#d66654", amber:"#e0a138", muted:"#8f8a80", accent:"#547361", line:"#e6ded1"};

const EXP = [["Ăn uống","🍜","#e38c5c"],["Đi lại","🚗","#5c8cbf"],["Nhà ở","🏠","#8c73b3"],["Hóa đơn","💡","#e6b84d"],
  ["Mua sắm","🛍️","#d97394"],["Giải trí","🎮","#73b3b3"],["Sức khỏe","💊","#d66161"],["Học tập","📚","#547361"],
  ["Gia đình","👨‍👩‍👧","#b38c66"],["Quà tặng","🎁","#bf80bf"],["Tiết kiệm","🏦","#669e7a"],["Khác","📦","#8c8c8c"]];
const INC = [["Lương","💼","#4d946b"],["Thưởng","⭐","#e6b340"],["Kinh doanh","🏪","#5c85bf"],["Làm thêm","💻","#8c73b8"],
  ["Đầu tư","📈","#409e9e"],["Lãi tiết kiệm","💰","#9eb359"],["Bán đồ","🏷️","#d98566"],["Được tặng","🎁","#d17a9e"],["Khác","📦","#8c8c8c"]];
const catOf = (list, name) => list.find(c => c[0] === name) || list[list.length - 1];

// ================== LƯU TRỮ AN TOÀN ==================
// - Dữ liệu chính: IndexedDB (dung lượng lớn, không bị giới hạn 5MB như localStorage)
// - Ghi gộp (debounce) để đỡ hao pin, ghi ngay khi thoát app
// - Tự chụp bản sao lưu nén (gzip) mỗi ngày, giữ 7 bản gần nhất → lỡ hỏng dữ liệu vẫn khôi phục được
// - Xin quyền lưu trữ bền vững để iOS không tự xóa
const KEY = "kehoach-data-v1";
const SNAP_KEEP = 7;
const EMPTY = () => ({goals:[], tasks:[], expenses:[], incomes:[], journals:[], lessons:[], notified:{}, meta:{}});
function normalize(d) {
  const e = EMPTY(); d = d && typeof d === "object" ? d : {};
  for (const k in e) e[k] = Array.isArray(e[k]) ? (Array.isArray(d[k]) ? d[k] : []) : (d[k] && typeof d[k] === "object" && !Array.isArray(d[k]) ? d[k] : {});
  return e;
}
let db = EMPTY();
const store = { idb:null, mode:"memory", persisted:false, lastSave:0, ok:true };
const IDB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open("kehoach", 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); if (!d.objectStoreNames.contains("snap")) d.createObjectStore("snap"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked")); }); },
  req(st, mode, fn) { return new Promise((res, rej) => { const tx = store.idb.transaction(st, mode), q = fn(tx.objectStore(st));
    let out; q.onsuccess = () => out = q.result; tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); },
  get: (st, k) => IDB.req(st, "readonly", o => o.get(k)),
  put: (st, k, v) => IDB.req(st, "readwrite", o => o.put(v, k)),
  del: (st, k) => IDB.req(st, "readwrite", o => o.delete(k)),
  keys: st => IDB.req(st, "readonly", o => o.getAllKeys()),
};
const canGz = typeof CompressionStream !== "undefined" && typeof DecompressionStream !== "undefined";
async function gz(str) { if (!canGz) return str; return await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(); }
async function gunz(v) { if (typeof v === "string") return v; return await new Response(new Blob([v]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }

let saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 300); }
async function writeNow() {
  clearTimeout(saveTimer); saveTimer = null;
  const str = JSON.stringify(db);
  try {
    if (store.mode === "idb") await IDB.put("kv", "data", str);
    else localStorage.setItem(KEY, str);
    store.ok = true; store.lastSave = Date.now();
    const sv = document.getElementById("saved-at"); if (sv) sv.textContent = "✓ Đã lưu tự động lúc " + hm(Date.now());
    return true;
  } catch (e) {
    store.ok = false; toast("⚠️ Không lưu được dữ liệu! Vào ⚙︎ → Xuất file sao lưu ngay.", "warn"); return false;
  }
}
async function snapshot(key) {
  if (store.mode !== "idb") return;
  try {
    await IDB.put("snap", key, await gz(JSON.stringify(db)));
    const ks = (await IDB.keys("snap")).map(String).sort();
    for (const k of ks.slice(0, Math.max(0, ks.length - SNAP_KEEP))) await IDB.del("snap", k);
  } catch (e) {}
}
async function readSnapshot(k) { try { return normalize(JSON.parse(await gunz(await IDB.get("snap", k)))); } catch (e) { return null; } }
async function latestSnapshot() {
  try { const ks = (await IDB.keys("snap")).map(String).sort().reverse(); for (const k of ks) { const d = await readSnapshot(k); if (d) return d; } } catch (e) {}
  return null;
}
function compact() {
  // Dọn các dấu "đã nhắc" cũ để file dữ liệu luôn gọn
  const ids = new Map(db.tasks.map(t => [t.id, t])), cut = Date.now() - 3 * 86400000;
  for (const k of Object.keys(db.notified)) {
    const [id, kind] = k.split(":"), t = ids.get(id);
    if (["sum", "goals", "jr"].includes(id)) { if (parseDate(kind.slice(0, 10)) != null && parseDate(kind.slice(0, 10)) < cut) delete db.notified[k]; continue; }
    if (!t || t.end < cut) delete db.notified[k];
  }
  // Xóa trang nhật ký trống
  db.journals = db.journals.filter(j => j.mood || (j.text || "").trim() || (j.grateful || "").trim());
}
async function loadDB() {
  let raw = null;
  try { store.idb = await IDB.open(); store.mode = "idb"; raw = await IDB.get("kv", "data"); } catch (e) { store.idb = null; store.mode = "local"; }
  let legacy = null; try { legacy = localStorage.getItem(KEY); } catch (e) {}
  let parsed = null;

function renderDay() {

  h += `<div class="seg"><button data-a="dayView" data-v="board" class="${ui.dayView === "board" ? "on" : ""}">▦ Bảng việc</button><button data-a="dayView" data-v="hours" class="${ui.dayView === "hours" ? "on" : ""}">☰ Theo giờ</button></div>`;
  if (ui.dayView === "board") return h + table3(list) + `<p class="muted small" style="text-align:center">Chạm ô Trạng thái để đánh dấu xong / chưa xong. Việc quá hạn có ô lý do viền đỏ — ghi lại để cuối tháng nhìn lại.</p>`;

// ---------- TIỀN (dùng chung) ----------
function periodBar(kind, P, A) {
  let h = `<div class="seg">${Object.keys(PL).map(p => `<button data-a="period" data-k="${kind}" data-v="${p}" class="${P === p ? "on" : ""}">${PL[p]}</button>`).join("")}</div>`;
  return h + (P === "all" ? `<div class="navh"><div class="t"><b class="serif">Toàn bộ thời gian</b></div></div>` : navh(ptitle(P, A), "", kind));
}
function entryList(title, items, isE) {
  const groups = {}; items.forEach(x => { const k = sod(x.date); (groups[k] = groups[k] || []).push(x); });
  const keys = Object.keys(groups).map(Number).sort((a, b) => b - a);
  let h = `<div class="card"><h3 class="serif">${title}</h3>`;
  if (!items.length) h += `<p class="muted small" style="text-align:center;padding:14px 0;margin:0">Chưa có khoản ${isE ? "chi" : "thu"} nào trong kỳ này.<br>Nhấn + để ghi lại.</p>`;
  keys.forEach(k => {
    const g = groups[k].sort((a, b) => b.date - a.date);
    h += `<div class="row sb small muted" style="font-weight:700;margin-top:10px"><span>${WD[dt(k).getDay()]}, ${dmy(k)}</span><span>${isE ? "" : "+"}${money(sum(g))}</span></div>`;
    g.forEach(x => {
      const c = catOf(isE ? EXP : INC, isE ? x.cat : x.src), note = isE ? x.reason : x.note;
      h += `<div class="entry" data-a="editMoney" data-k="${isE ? "exp" : "inc"}" data-id="${x.id}"><span class="ic" style="background:${c[2]}26">${c[1]}</span><div style="flex:1;min-width:0"><div style="font-weight:600">${c[0]}</div><div class="muted small">${isE ? "" : "lúc "}${hm(x.date)}${note ? " · " + esc(note) : ""}</div></div><b style="color:${isE ? C.warn : C.done};font-variant-numeric:tabular-nums;white-space:nowrap">${isE ? "−" : "+"}${money(x.amount)}</b></div>`;
    });
  });
  return h + "</div>";
}

// ---------- CHI TIÊU ----------

// ---------- THU NHẬP ----------
function renderInc() {
  const P = ui.inP, A = ui.inA, r = range(P, A), items = inRange(db.incomes, r), exps = inRange(db.expenses, r);
  const total = sum(items), spent = sum(exps), net = total - spent;
  let h = periodBar("inc", P, A);
  h += `<div class="card"><div class="muted small">Tổng thu ${SCOPE[P]}</div><div class="big" style="color:${C.done}">${money(total)}</div><div class="muted small">${items.length} khoản thu</div>${P !== "all" ? changeLine(total, sum(inRange(db.incomes, range(P, shiftP(P, A, -1)))), PREV[P], true) : ""}<hr><div class="row sb"><div><div class="muted small">Đã chi</div><b style="color:${C.warn}">${money(spent)}</b></div><div style="text-align:right"><div class="muted small">Còn lại (thu − chi)</div><b style="color:${net >= 0 ? C.done : C.warn}">${net < 0 ? "−" : ""}${money(Math.abs(net))}</b></div></div>${total ? `<div class="muted small" style="margin-top:6px">Tỷ lệ tiết kiệm: ${Math.round(Math.max(net, 0) / total * 100)}%</div>` : ""}</div>`;
  const long = P === "year" || P === "all";
  if (items.length) {
    const b = buckets(items, P, A);
    if (long) {
      const avg = b.reduce((s, x) => s + x.value, 0) / (b.length || 1);
      h += `<div class="card"><h3 class="serif">Thu nhập từng tháng</h3>${svgLine(b, {avg})}</div>`;
      const diffs = b.slice(1).map((x, i) => ({label:x.label, t:x.t, value:x.value - b[i].value}));
      diffs.forEach(d => d.color = d.value >= 0 ? C.done : C.warn);
      const upMax = diffs.filter(d => d.value > 0).sort((a, c) => c.value - a.value)[0], downMax = diffs.filter(d => d.value < 0).sort((a, c) => a.value - c.value)[0];
      h += `<div class="card"><h3 class="serif">Tăng / giảm so với tháng trước</h3>${diffs.length ? svgColumns(diffs, {h:180}) + `<div class="small" style="margin-top:6px;font-weight:700">${upMax ? `<div style="color:${C.done}">↗ Tăng mạnh nhất: tháng ${pad(M(upMax.t))}/${Y(upMax.t)} +${short(upMax.value)}</div>` : ""}${downMax ? `<div style="color:${C.warn}">↘ Giảm mạnh nhất: tháng ${pad(M(downMax.t))}/${Y(downMax.t)} −${short(-downMax.value)}</div>` : ""}</div>` : `<p class="muted small">Cần ít nhất 2 tháng dữ liệu.</p>`}</div>`;
    } else {
      let run = 0; const cum = b.map(x => ({...x, value: run += x.value}));
      h += `<div class="card"><h3 class="serif">Thu nhập cộng dồn ${P === "month" ? "trong tháng" : "trong ngày"}</h3>${svgLine(cum, {step:true})}</div>`;
    }
    h += hbars("Thu nhập theo nguồn", groupCats(items, "src", INC));
  }
  if (long && (items.length || exps.length)) {
    let bi = buckets(items, P, A), be = buckets(exps, P, A);
    if (P === "all") { // gộp theo cùng mốc tháng
      const keys = [...new Set([...bi, ...be].map(x => x.t))].sort((a, b) => a - b);
      const mi = Object.fromEntries(bi.map(x => [x.t, x.value])), me = Object.fromEntries(be.map(x => [x.t, x.value]));
      const s = keys[0], e = keys[keys.length - 1]; bi = []; for (let t = s; t <= e; t = addM(t, 1)) bi.push({t, label: pad(M(t)) + "/" + String(Y(t)).slice(2), a: mi[t] || 0, b: me[t] || 0});
      h += `<div class="card"><h3 class="serif">Thu và chi theo tháng</h3>${svgGrouped(bi)}<div class="lg"><span><i style="background:${C.done}"></i>Thu</span><span><i style="background:${C.warn}"></i>Chi</span></div></div>`;
    } else {
      const g = bi.map((x, i) => ({label:x.label, a:x.value, b:be[i] ? be[i].value : 0}));
      h += `<div class="card"><h3 class="serif">Thu và chi theo tháng</h3>${svgGrouped(g)}<div class="lg"><span><i style="background:${C.done}"></i>Thu</span><span><i style="background:${C.warn}"></i>Chi</span></div></div>`;
    }
  }
  return h + entryList("Chi tiết các khoản thu", items, false);
}

// ---------- NHẬT KÝ ----------
const MOODS = [["😞","Tệ"],["😕","Hơi tệ"],["😐","Bình thường"],["🙂","Tốt"],["😄","Tuyệt vời"]];
const LTAGS = [["Công việc","💼"],["Tiền bạc","💰"],["Sức khỏe","💪"],["Quan hệ","❤️"],["Bản thân","🌱"],["Khác","📌"]];
const tagIcon = t => (LTAGS.find(x => x[0] === t) || LTAGS[5])[1];
const jOf = day => db.journals.find(j => j.day === sod(day));
function writtenDays() { const s = new Set(); db.journals.forEach(j => s.add(j.day)); db.lessons.forEach(l => s.add(l.day)); return s; }
function streak() {
  const s = writtenDays(); let d = sod(Date.now()), n = 0;
  if (!s.has(d)) d = addD(d, -1);
  while (s.has(d)) { n++; d = addD(d, -1); }
  return n;
}
function lessonRow(l, showDate) {

}
function renderJournal() {

    <textarea class="jt" id="l-text" rows="2" placeholder="VD: Làm việc khó nhất vào buổi sáng thì hiệu quả hơn" style="margin-top:10px"></textarea>

// ================== Hành động ==================
function shift(k, n) {
  if (k === "year") ui.date = addY(ui.date, n);
  else if (k === "month") ui.date = addM(ui.date, n);
  else if (k === "day") ui.date = addD(ui.date, n);
  else if (k === "exp") ui.exA = shiftP(ui.exP, ui.exA, n);
  else if (k === "inc") ui.inA = shiftP(ui.inP, ui.inA, n);
  else if (k === "jday") ui.jDate = addD(ui.jDate, n);
  render();
}
function clearNotified(id) { Object.keys(db.notified).forEach(k => { if (k.startsWith(id + ":")) delete db.notified[k]; }); }
const findT = id => db.tasks.find(x => x.id === id);

const actions = {
  tab: v => { ui.tab = v; render(); window.scrollTo(0, 0); },
  scope: v => { ui.scope = v; render(); },
  today: () => { const n = Date.now(); if (ui.tab === "plan") { ui.date = n; ui.scope = "day"; } else if (ui.tab === "exp") ui.exA = n; else if (ui.tab === "inc") ui.inA = n; else ui.jDate = n; render(); },
  prev: v => shift(v, -1),
  next: v => shift(v, 1),
  pickDay: v => { ui.date = +v; ui.scope = "day"; render(); window.scrollTo(0, 0); },
  pickMonth: v => { ui.date = +v; ui.scope = "month"; render(); window.scrollTo(0, 0); },
  period: (v, id, el) => { if (el.dataset.k === "exp") ui.exP = v; else ui.inP = v; render(); },
  fab: () => {
    if (ui.tab === "plan") { if (ui.scope === "day") taskForm(null); else goalForm(null, Y(ui.date), ui.scope === "month" ? M(ui.date) : 0); }
    else if (ui.tab === "jour") { if (ui.jMode === "lessons") lessonForm(null); else { const t = $("[data-jf=text]"); if (t) { t.scrollIntoView({block:"center"}); t.focus(); } } }
    else moneyForm(ui.tab, null);
  },
  addTask: v => taskForm(null, +v),
  editTask: (v, id) => taskForm(findT(id)),
  toggleTask: (v, id, el) => {
    const t = findT(id); if (!t) return;
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null; save();
    if (t.done) toast("🎉 Hoàn thành: " + t.title);
    if (el.dataset.close) closeSheet();
    if (el.dataset.refresh === "overdue") overdueSheet();
    render();
  },
  delTask: (v, id) => { if (!confirm("Xóa công việc này?")) return; db.tasks = db.tasks.filter(x => x.id !== id); clearNotified(id); save(); closeSheet(); render(); },
  saveTask: () => {
    const title = $("#f-title").value.trim(); if (!title) return toast("Hãy nhập tên công việc", "warn");
    const day = parseDate($("#f-day").value); if (day == null) return toast("Hãy chọn ngày", "warn");
    const tm = v => { const [h, m] = (v || "0:0").split(":").map(Number); return (h || 0) * 3600000 + (m || 0) * 60000; };
    const s = day + tm($("#f-start").value); let e = day + tm($("#f-end").value);
    if (e === s) e = s + 3600000; else if (e < s) e = addD(e, 1);
    const dur = e - s, before = +$("#f-before").value, note = $("#f-note").value.trim();
    const fields = {title, note, remind: before >= 0, before: Math.max(before, 0)};
    if (ui.edit.id) { const t = findT(ui.edit.id); Object.assign(t, fields, {start:s, end:e, reason:($("#f-reason")?.value || "").trim()}); clearNotified(t.id); }
    else {
      const rep = $("#f-rep").value; let days = [s];
      if (rep !== "none") {
        const lim = parseDate($("#f-until").value) ?? s, wd0 = dt(s).getDay(); days = []; let cur = s;
        while (sod(cur) <= lim && days.length < 366) {
          const wd = dt(cur).getDay();
          if (rep === "daily" || (rep === "weekdays" && wd >= 1 && wd <= 5) || (rep === "weekly" && wd === wd0)) days.push(cur);
          cur = addD(cur, 1);
        }
        if (!days.length) days = [s];
      }
      days.forEach(st => db.tasks.push({id:uid(), ...fields, start:st, end:st + dur, done:false, doneAt:null, created:Date.now()}));
      if (days.length > 1) toast(`Đã thêm ${days.length} lần lặp lại`);
    }
    save(); closeSheet(); render();
  },
  addGoal: v => { const [y, m] = v.split("-").map(Number); goalForm(null, y, m); },
  editGoal: (v, id) => goalForm(db.goals.find(g => g.id === id)),
  toggleGoal: (v, id) => {
    const g = db.goals.find(x => x.id === id); g.done = !g.done; g.doneAt = g.done ? Date.now() : null; save();
    if (g.done) toast("🎯 Đã đạt mục tiêu: " + g.title);
    render();
  },
  saveGoal: () => {
    const title = $("#f-title").value.trim(); if (!title) return toast("Hãy nhập mục tiêu", "warn");
    const f = {title, note:$("#f-note").value.trim(), year:+$("#f-year").value || Y(Date.now()), month:+$("#f-month").value};
    if (ui.edit.id) Object.assign(db.goals.find(g => g.id === ui.edit.id), f);
    else db.goals.push({id:uid(), ...f, done:false, doneAt:null, created:Date.now()});
    save(); closeSheet(); render();
  },
  delGoal: (v, id) => { if (!confirm("Xóa mục tiêu này?")) return; db.goals = db.goals.filter(g => g.id !== id); save(); closeSheet(); render(); },
  editMoney: (v, id, el) => { const k = el.dataset.k; moneyForm(k, (k === "exp" ? db.expenses : db.incomes).find(x => x.id === id)); },
  quick: v => { ui.edit.amount = +v ? Math.min(ui.edit.amount + +v, 9999999999999) : 0; $("#f-amt").value = ui.edit.amount ? fmtNum(ui.edit.amount) : ""; },
  selCat: (v, id, el) => { ui.edit.cat = v; document.querySelectorAll(".cats button").forEach(b => b.classList.toggle("on", b === el)); },
  saveMoney: () => {
    const e = ui.edit; if (!(e.amount > 0)) return toast("Hãy nhập số tiền", "warn");
    const date = parseDT($("#f-date").value) ?? Date.now(), note = $("#f-note").value.trim();
    const isE = e.type === "exp", arr = isE ? db.expenses : db.incomes;
    const f = isE ? {amount:e.amount, cat:e.cat, reason:note, date} : {amount:e.amount, src:e.cat, note, date};
    if (e.id) Object.assign(arr.find(x => x.id === e.id), f); else arr.push({id:uid(), ...f});
    save(); closeSheet(); render();
    toast(isE ? "Đã ghi khoản chi " + money(e.amount) : "Đã ghi khoản thu " + money(e.amount));
  },
  delMoney: () => {
    if (!confirm("Xóa khoản này?")) return;
    const k = ui.edit.type === "exp" ? "expenses" : "incomes"; db[k] = db[k].filter(x => x.id !== ui.edit.id);
    save(); closeSheet(); render();
  },
  dayView: v => { ui.dayView = v; try { localStorage.setItem("kehoach-dayview", v); } catch (e) {} render(); },
  moveTask: (v, id) => {
    const t = findT(id), dur = Math.max(t.end - t.start, 15 * 60000), now = Date.now();
    let s;
    if (sod(t.start) < sod(now)) { s = sod(now) + (t.start - sod(t.start)); if (s < now) { const d = new Date(now); d.setMinutes(0, 0, 0); s = d.getTime() + 3600000; } }
    else s = addD(t.start, 1);
    t.start = s; t.end = s + dur; clearNotified(t.id); save(); render();
    toast("Đã dời sang " + (same(s, now) ? "hôm nay" : WD[dt(s).getDay()] + " " + pad(D(s)) + "/" + pad(M(s))) + " lúc " + hm(s));
  },
  jMode: v => { ui.jMode = v; render(); window.scrollTo(0, 0); },
  pickJDay: v => { ui.jDate = +v; render(); window.scrollTo(0, 0); },
  setMood: v => { const j = jOf(ui.jDate); journalField("mood", j && j.mood === +v ? 0 : +v); render(); },
  addLesson: () => {
    const text = $("#l-text").value.trim(); if (!text) return toast("Hãy viết bài học trước", "warn");
    db.lessons.push({id:uid(), day:sod(ui.jDate), text, tag:$("#l-tag").value, star:false, created:Date.now()});
    save(); render(); toast("💡 Đã lưu bài học");
  },
  starLesson: (v, id) => { const l = db.lessons.find(x => x.id === id); l.star = !l.star; save(); if (ui.jMode === "lessons" && $("#lesson-list")) { render(); } else render(); },
  editLesson: (v, id) => lessonForm(db.lessons.find(x => x.id === id)),
  saveLesson: () => {
    const text = $("#f-ltext").value.trim(); if (!text) return toast("Hãy viết bài học", "warn");
    const f = {text, tag:$("#f-ltag").value, day:parseDate($("#f-lday").value) ?? sod(Date.now()), star:$("#f-lstar").value === "1"};
    if (ui.edit.id) Object.assign(db.lessons.find(x => x.id === ui.edit.id), f); else db.lessons.push({id:uid(), ...f, created:Date.now()});
    save(); closeSheet(); render(); toast("💡 Đã lưu bài học");
  },
  delLesson: (v, id) => { if (!confirm("Xóa bài học này?")) return; db.lessons = db.lessons.filter(x => x.id !== id); save(); closeSheet(); render(); },
  jTag: v => { ui.jTag = v; render(); },
  nextReview: () => { const all = db.lessons; if (all.length > 1) { let n; do { n = all[Math.floor(Math.random() * all.length)].id; } while (n === ui.jPick); ui.jPick = n; } render(); },
  restoreSnap: async v => {
    const d = await readSnapshot(v); if (!d) return toast("Bản sao lưu này bị lỗi", "warn");
    if (!confirm("Khôi phục dữ liệu về bản sao lưu " + v + "? Dữ liệu hiện tại sẽ được lưu thêm 1 bản trước khi thay.")) return;
    await snapshot(isoDate(Date.now()) + "T" + hm(Date.now()) + " (trước khôi phục)");
    db = d; await writeNow(); closeSheet(); render(); toast("Đã khôi phục dữ liệu");
  },
  showOverdue: () => overdueSheet(),
  moveToday: (v, id) => {
    const t = findT(id), dur = Math.max(t.end - t.start, 15 * 60000), now = Date.now();
    let s = sod(now) + (t.start - sod(t.start));
    if (s < now) { const d = new Date(now); d.setMinutes(0, 0, 0); s = d.getTime() + 3600000; }
    t.start = s; t.end = s + dur; clearNotified(t.id); save(); overdueSheet(); render();
    toast("Đã dời sang " + hm(s) + " hôm nay");
  },
  closeSheet: () => closeSheet(),
  settings: () => { settingsSheet(); fillStorageInfo(); },
  enableNotif: async () => {
    try { const r = await Notification.requestPermission(); toast(r === "granted" ? "Đã bật thông báo 🔔" : "Chưa được cấp quyền thông báo", r === "granted" ? "" : "warn"); }
    catch (e) { toast("Thiết bị chưa hỗ trợ thông báo", "warn"); }
    settingsSheet(); fillStorageInfo();
  },
  exportData: async () => {
    db.meta.lastExport = Date.now(); await writeNow();
    const name = "kehoach-saoluu-" + isoDate(Date.now()) + ".json";
    const blob = new Blob([JSON.stringify(db)], {type:"application/json"});
    try {
      const file = new File([blob], name, {type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; }
    } catch (e) { if (e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  },
  importData: () => $("#f-import").click(),
};

document.addEventListener("click", e => {
  if (e.target.id === "sheet-wrap") return closeSheet();
  const el = e.target.closest("[data-a]"); if (!el) return;
  const fn = actions[el.dataset.a]; if (!fn) return;
  e.preventDefault(); e.stopPropagation();
  fn(el.dataset.v, el.dataset.id, el);
});
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.reason;
  if (id) { const t = findT(id); if (t) { t.reason = e.target.value.trim(); save(); e.target.classList.toggle("need", isOverdue(t) && !t.reason); if (t.reason) toast("Đã lưu lý do"); } }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.jf) { journalField(e.target.dataset.jf, e.target.value); const sv = $("#saved-at"); if (sv) sv.textContent = "Đang lưu…"; return; }
  if (e.target.id === "l-search") { ui.jQuery = e.target.value; const box = $("#lesson-list"); if (box) box.innerHTML = lessonListHTML(); return; }
  if (e.target.id === "f-amt" && ui.edit) {
    const v = +e.target.value.replace(/\D/g, "").slice(0, 13) || 0;
    ui.edit.amount = v; e.target.value = v ? fmtNum(v) : "";
  }
});
$("#f-import").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || typeof data !== "object" || !Array.isArray(data.tasks)) throw new Error("bad");
    if (!confirm("Thay toàn bộ dữ liệu hiện tại bằng file sao lưu này?")) return;
    await snapshot(isoDate(Date.now()) + "T" + hm(Date.now()) + " (trước khôi phục)");
    db = normalize(data); compact(); await writeNow(); closeSheet(); render(); toast("Đã khôi phục dữ liệu");
  } catch (err) { toast("File sao lưu không hợp lệ", "warn"); }
  finally { e.target.value = ""; }
});

// ================== Toast & nhắc nhở ==================
let toastTimer, toastQueue = [];
function toast(msg, type) {
  const el = $("#toast"); el.textContent = msg; el.className = "show " + (type || "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = type || "", 2800);
  if (navigator.vibrate) navigator.vibrate(25);
}
let swReg = null;
async function notify(title, body, type) {
  toastQueue.push([title + " — " + body, type]);
  try {
    if ("Notification" in window && Notification.permission === "granted" && swReg) await swReg.showNotification(title, {body, icon:"icon-192.png", badge:"icon-192.png", tag:title + body});
  } catch (e) {}
}
setInterval(() => { const m = toastQueue.shift(); if (m) toast(m[0], m[1]); }, 3200);

function checkReminders() {
  const n = Date.now(); let changed = false;
  db.tasks.forEach(t => {
    if (t.done) return;
    const k1 = t.id + ":start", k2 = t.id + ":due", k3 = t.id + ":due2";
    if (t.remind && n >= t.start - t.before * 60000 && n < t.end && !db.notified[k1]) {
      db.notified[k1] = 1; changed = true;
      notify("⏰ " + t.title, (n < t.start ? `Còn ${Math.ceil((t.start - n) / 60000)} phút` : "Đến giờ rồi") + " · " + hm(t.start) + " – " + hm(t.end));
    }
    if (n >= t.end && n - t.end < 12 * 3600000 && !db.notified[k2]) {
      db.notified[k2] = 1; changed = true;
      notify("❗ Chưa hoàn thành", `“${t.title}” đã hết giờ. Xong thì đánh dấu hoàn thành, chưa xong thì ghi lại lý do nhé!`, "warn");
    }
    if (n >= t.end + 2 * 3600000 && n - t.end < 12 * 3600000 && !db.notified[k3]) {
      db.notified[k3] = 1; changed = true;
      notify("🔔 Nhắc lại", `Bạn vẫn chưa hoàn thành “${t.title}”.`, "warn");
    }
  });
  const d = new Date(n), k = "sum:" + isoDate(n);
  if (d.getHours() >= 21 && !db.notified[k]) {
    const list = db.tasks.filter(t => same(t.start, n));
    if (list.length) {
      db.notified[k] = 1; changed = true;
      const p = list.filter(t => !t.done).length;
      notify("📋 Tổng kết ngày", p ? `Hôm nay còn ${p}/${list.length} việc chưa hoàn thành. Cố lên!` : `🎉 Tuyệt vời! Bạn đã hoàn thành tất cả ${list.length} việc hôm nay.`, p ? "warn" : "");
    }
  }
  const kj = "jr:" + isoDate(n);
  if (d.getHours() * 60 + d.getMinutes() >= 21 * 60 + 30 && !db.notified[kj] && !jOf(n) && !db.lessons.some(l => l.day === sod(n))) {
    db.notified[kj] = 1; changed = true; notify("📔 Viết nhật ký", "Dành 5 phút ghi lại hôm nay và 1 bài học rút ra nhé.");
  }
  const km = "goals:" + Y(n) + "-" + M(n);
  if (D(n) >= 25 && !db.notified[km]) {
    const left = db.goals.filter(g => g.year === Y(n) && g.month === M(n) && !g.done).length;
    if (left) { db.notified[km] = 1; changed = true; notify("🎯 Mục tiêu tháng " + M(n), `Còn ${left} mục tiêu tháng này chưa đạt. Tháng sắp hết rồi!`, "warn"); }
  }
  if (changed) {
    // dọn khóa cũ
    const ids = new Set(db.tasks.map(t => t.id));
    Object.keys(db.notified).forEach(key => { const id = key.split(":")[0]; if (!["sum", "goals", "jr"].includes(id) && !ids.has(id)) delete db.notified[key]; });
    save();
    if (!$("#sheet-wrap").classList.contains("show")) render();
  }
}

// ================== Khởi động ==================
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").then(r => swReg = r).catch(() => {});
}
$("#app").innerHTML = '<p style="text-align:center;margin-top:40vh;color:#8f8a80">Đang mở…</p>';
loadDB().then(() => { render(); setTimeout(checkReminders, 800); setInterval(checkReminders, 20000); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); checkReminders(); } });
</script>
</body>
